server:
  port: 8085
  max-http-request-header-size: 64KB
  servlet:
    context-path: /

spring:
  application:
    name: meeting-intelligence-api

  # Spec 018: chaves locais em .env (CHAVE=valor) na pasta de onde o backend é iniciado (backend/ pelo
  # Maven). Fora do Git; variáveis de ambiente têm prioridade.
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Datasource & JPA
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:meet_intelligence}
    username: ${DB_USER:meet_user}
    password: ${DB_PASSWORD:meet_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6389}
      timeout: 3000ms

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5675}
    username: ${RABBITMQ_USER:meet_admin}
    password: ${RABBITMQ_PASSWORD:meet_rabbit_password}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

  # Spring Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:726281906025-91lbpv9q3v65qqv2uf1117d10smgnm1u.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events.readonly
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Custom Application Configs
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:MEET_INTELLIGENCE_AES256_KEY_32B!}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minio_admin}
    secret-key: ${S3_SECRET_KEY:minio_secure_password}
    bucket-name: ${S3_BUCKET_NAME:meet-recordings}
    region: ${S3_REGION:us-east-1}
  ai:
    default-provider: ${DEFAULT_LLM_PROVIDER:GEMINI}
    gemini:
      api-key: ${GEMINI_API_KEY:mock-key}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      # Modelo só do copiloto de entrevistas (spec 008, RF-09). Vazio = mesmo modelo da organização/servidor.
      copilot-model: ${GEMINI_COPILOT_MODEL:}
    # OpenAI: usada só para transcrição de gravações (gpt-transcribe) e embeddings da busca semântica
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
    grok:
      api-key: ${XAI_API_KEY:mock-key}
      model: ${GROK_MODEL:grok-4.7}
      copilot-model: ${GROK_COPILOT_MODEL:}
      # Transcrição com a mesma chave xAI (spec 017). Vazio = grok-voice-transcribe-2.0
      stt-model: ${GROK_STT_MODEL:}
    claude:
      api-key: ${ANTHROPIC_API_KEY:mock-key}
      model: ${CLAUDE_MODEL:claude-opus-5-5}
      copilot-model: ${CLAUDE_COPILOT_MODEL:}
    deepgram:
      api-key: ${DEEPGRAM_API_KEY:mock-key}

  # Transcrição (spec 002)
  speech:
    # Simulação de transcrição para desenvolvimento sem chaves (grava source=SIMULATION). Nunca em produção.
    simulation-enabled: ${SPEECH_SIMULATION_ENABLED:false}
    # Spec 018: chaves do servidor (pagas pelo produto) antes das chaves da organização.
    # false = ordem antiga, para planos em que o cliente traz a própria chave.
    server-keys-first: ${SPEECH_SERVER_KEYS_FIRST:true}
    local-google-stt:
      # STT via Python/speech_recognition (endpoint não oficial do Google, sem SLA). Só desenvolvimento.
      enabled: ${LOCAL_GOOGLE_STT_ENABLED:false}
    timeout:
      connect-ms: 3000
      live-read-ms: 15000
      batch-read-ms: 120000
    retry-delay-ms: 500
    live-budget-ms: 30000
    batch-budget-ms: 300000

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      llmService:
        max-attempts: 3
        wait-duration: 2000ms
        exponential-backoff-multiplier: 2

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
