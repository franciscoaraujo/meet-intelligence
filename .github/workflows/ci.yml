# CI: roda em toda pull request e em todo push na main.
# Os nomes dos jobs ("Backend" e "Frontend") são os checks exigidos na regra da main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários + integração (*IT) com PostgreSQL/pgvector real via Testcontainers (Docker do runner)
      - name: mvn test
        run: mvn -B -ntp test
      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes (Vitest)
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Tamanho do bundle (spec 008, CA-11)
        run: npm run check:bundle
